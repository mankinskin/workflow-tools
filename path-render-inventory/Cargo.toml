[package]
name = "path-render-inventory"
version = "0.1.0"
edition = "2024"
description = "Conservative recursive Rust path-rendering inventory and campaign gates"

[dependencies]
clap = { version = "4", features = ["derive"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
toml = "0.8"
