name: OpenRouter Auth Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "openrouter-auth/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/openrouter-auth-validation.yml"

concurrency:
  group: openrouter-auth-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: workflow-tools
          submodules: recursive

      - name: Checkout memory-fixtures workspace patch source
        uses: actions/checkout@v4
        with:
          repository: mankinskin/memory-api
          ref: 499a8d3bd3b726bd42c1420c9603f5e9b914089e
          path: context-engine/memory-api

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and test openrouter-auth
        working-directory: workflow-tools
        shell: bash
        run: |
          cargo fmt --check -p openrouter-auth
          cargo test -p openrouter-auth
          cargo clippy -p openrouter-auth -- -D warnings
