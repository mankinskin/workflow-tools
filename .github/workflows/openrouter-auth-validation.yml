name: OpenRouter Auth Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "openrouter-auth/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/openrouter-auth-validation.yml"

concurrency:
  group: openrouter-auth-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Secret Service dependency
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring

      - name: Build and test openrouter-auth
        shell: bash
        run: |
          cargo fmt --check -p openrouter-auth
          cargo test -p openrouter-auth
          cargo clippy -p openrouter-auth -- -D warnings
