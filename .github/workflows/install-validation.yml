name: Install Validation

on:
  workflow_dispatch:

concurrency:
  group: install-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-install-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Docker version
        run: docker version

      - name: Run Docker install validation
        shell: bash
        run: bash install/docker-validation/run-docker-validation.sh
