note = "Decisions interviewed 2026-07-27: (1) Repo target is the already-provisioned, currently EMPTY https://github.com/mankinskin/ticket (repository naming, per 4f284d45). (2) context-engine consumes it as a PLAIN GIT DEP (branch = main), NOT a submodule — matching the memory-fixtures precedent, not memory-kernel. (3) Frontends DO move: ticket-viewer (memory-viewers/ticket-viewer, incl. dioxus frontend) and ticket-vscode (memory-api/ticket-vscode) go into the new repo under frontend/ as separate consumer crates, per the domain-crate contract layout. (4) The repo-root .ticket artifact store DOES NOT move — deferred to Phase C. (5) Gated on consolidation ticket 26da8f59: the legacy ticket-cli/ticket-mcp/ticket-http crates must be retired onto the pilot crate bins first so the duplication is not exported. (6) Canonical CLI binary naming for every extracted domain uses the bare domain name; ticket uses `ticket`. (7) Risk valve: if a session cannot land both, consolidation lands fully first and the split is handed off. || DECISION RECONCILED (2026-08-17): the git submodule approach (.gitmodules `[submodule \"ticket\"]`, external repo https://github.com/mankinskin/ticket) is the correct and final consumption mechanism. The earlier 'plain git dep, not submodule' note is superseded."
