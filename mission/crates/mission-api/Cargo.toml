[package]
name = "mission-api"
version = "0.1.0"
edition = "2024"
description = "Internal durable mission roadmap model, validation, storage, and rendering"

[lib]
name = "mission_api"
path = "src/lib.rs"

[dependencies]
memory-kernel = { git = "https://github.com/mankinskin/memory-kernel", branch = "main" }
pulldown-cmark = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.10"
thiserror = "2"
fs4 = "0.11"
uuid = { version = "1", features = ["serde", "v4"] }
spec-api = { path = "../../../spec/crates/spec-api" }
ticket-api = { path = "../../../ticket/crates/ticket-api" }
test-api = { path = "../../../test/crates/test-api" }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
