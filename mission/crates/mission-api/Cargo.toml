[package]
name = "mission-api"
version = "0.1.0"
edition = "2024"
description = "Internal durable mission roadmap model, validation, storage, and rendering"

[lib]
name = "mission_api"
path = "src/lib.rs"

[dependencies]
pulldown-cmark = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
