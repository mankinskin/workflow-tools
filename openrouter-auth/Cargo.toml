[package]
name = "openrouter-auth"
version = "0.1.0"
edition = "2024"
description = "Standalone OpenRouter OAuth PKCE credential CLI: browser login + native credential storage"

[[bin]]
name = "openrouter-auth"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
keyring = "4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
url = "2"
