[package]
name = "agent-builder"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5", features = ["derive"] }
rig = { version = "0.42.0", features = ["rmcp"] }
rmcp = { version = "2", features = ["client", "transport-child-process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "process"] }
toml = "1.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
