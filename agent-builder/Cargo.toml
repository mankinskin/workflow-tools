[package]
name = "agent-builder"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5", features = ["derive"] }
rig = "0.42.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
toml = "1.0"
